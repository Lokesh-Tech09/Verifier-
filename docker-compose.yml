version: "3.8"

services:
  drawtally-api:
    build: .
    image: drawtally-api:latest
    container_name: drawtally-api
    ports:
      - "8000:8000"
    volumes:
      - drawtally-temp:/tmp/drawtally
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  drawtally-temp:
